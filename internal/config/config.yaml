config:
  port: 8080
  tls: false
  auth: true
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

auth:
  type: jwt
  jwt_secret: "secret"

apis:
  - name: sales_api
    protocol: http
    routes:
      - path: /v1/sales
        upstreams:
          - host: localhost
            port: 8879
          - host: localhost
            port: 8880
            tls: true
            tls_insecure: true
    load_balancing: round_robin
    rate_limit: 5
    max_retries: 2
    retry_delay_ms: 100
    fallback_response:
      status: 503
      body_base64: "eyJlcnJvciI6ICJzZXJ2aWNlIHVuYXZhaWxhYmxlIn0="

  - name: users_api
    protocol: http
    routes:
      - path: /v1/users
        upstreams:
          - host: localhost
            port: 8866
          - host: localhost
            port: 8844
    cors:
      allowed_origins: ["*"]
      allowed_methods: ["GET", "POST", "OPTIONS"]
      allowed_headers: ["Authorization", "Content-Type"]
    load_balancing: round_robin
    rate_limit: 5
    max_retries: 3
    retry_delay_ms: 100
    fallback_response:
      status: 503
      body: '{"error": "service unavailable"}'

  - name: chat_ws
    protocol: websocket
    routes:
      - path: /ws/chat
        upstreams:
          - host: localhost
            port: 9001
          - host: localhost
            port: 9002
    sticky_sessions: true
